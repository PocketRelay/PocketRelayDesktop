[package]
name = "pocket-relay-desktop-server"
version = "0.0.0"
description = "Pocket Relay Desktop app server"

edition.workspace = true
license.workspace = true
keywords.workspace = true
authors.workspace = true

[dependencies]
pocket-relay-desktop-core.workspace = true
pocket-relay-desktop-blaze-networking.workspace = true
pocket-relay-desktop-client-rpc.workspace = true

tdf.workspace = true
bytes.workspace = true

tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true

tracing.workspace = true

uuid.workspace = true

anyhow.workspace = true

# SSLv3 implementation for the game communications
blaze-ssl-async = "0.4"

# HTTP server
axum = "0.8.9"
hyper = "1.6"
hyper-util = { version = "0.1.10", features = ["tokio"] }
tower = { version = "0.5.2", features = ["util"] }

tarpc.workspace = true

serde.workspace = true
serde_json.workspace = true

indoc = "2"

# Resource embedding
embeddy = "0.1"

[features]
default = []
large-packet-logging = []
